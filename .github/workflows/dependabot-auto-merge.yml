# Activa el auto-merge en los PR de Dependabot con actualizaciones menores o
# de parche. GitHub solo fusiona cuando pasan los checks obligatorios del
# ruleset de main (`verify`); si el CI falla, el PR queda abierto.
# Las actualizaciones mayores siguen esperando revisión manual.
#
# El merge lo hace GITHUB_TOKEN, cuyos eventos no lanzan otros workflows: no
# se despliega a Pages. Lo fusionado se publica con el siguiente push a main
# (o ejecutando "CI / Deploy to Pages" a mano desde Actions).
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge
        # En PR agrupados, update-type es el cambio más alto del grupo: si
        # alguna dependencia sube de versión mayor, no se activa.
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
